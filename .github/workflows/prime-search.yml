name: Prime Search

# Runs 12 hours a day: two 6-hour sessions (GitHub caps one job at 6 hours).
# 06:00-12:00 IST and 12:00-18:00 IST.
on:
  schedule:
    - cron: "30 0 * * *"   # 06:00 IST
    - cron: "30 6 * * *"   # 12:00 IST
  workflow_dispatch:        # allows manual runs from the Actions tab

permissions:
  contents: write           # lets the job commit progress back to the repo

concurrency:
  group: prime-search
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 355    # hard safety margin under the 6-hour job cap
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run prime search (~6 hours)
        run: python prime_finder.py --hours 5.9

      - name: Commit progress and results
        run: |
          git config user.name "prime-bot"
          git config user.email "actions@github.com"
          git add progress.json primes.txt search.log
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "Prime search progress update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
          
